    - unknown

  transparency_class:
    - opaque
    - translucent
    - transparent
    - unknown

  thermal_conductivity_class:
    - insulator
    - low
    - medium
    - high
    - unknown

  flammability_class:
    - non_flammable
    - low
    - medium
    - high
    - unknown

  object_temperature_class:
